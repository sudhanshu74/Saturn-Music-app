<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Saturn Body -->
  <circle cx="60" cy="60" r="25" fill="#f39c12" stroke="#e67e22" stroke-width="3" />

  <!-- Funky Rings -->
  <ellipse cx="60" cy="60" rx="40" ry="10" fill="none" stroke="#e74c3c" stroke-width="4" transform="rotate(-20 60 60)" />
  <ellipse cx="60" cy="60" rx="44" ry="12" fill="none" stroke="#c0392b" stroke-opacity="0.4" stroke-width="2" transform="rotate(-20 60 60)" />

  <!-- Googly Eye -->
  <circle cx="52" cy="52" r="5.5" fill="#fff" />
  <circle cx="54" cy="54" r="2.5" fill="#000" />

  <!-- Sparkle dots -->
  <circle cx="20" cy="30" r="2.5" fill="#fff">
    <animate attributeName="r" values="2.5;1.5;2.5" dur="1.6s" repeatCount="indefinite" />
  </circle>
  <circle cx="100" cy="25" r="2" fill="#fff" opacity="0.8">
    <animate attributeName="r" values="2;1;2" dur="1.8s" repeatCount="indefinite" />
  </circle>

  <!-- Funky mouth -->
  <path d="M50 68 Q60 75 70 68" stroke="#8e44ad" stroke-width="2" fill="none" />

</svg>
