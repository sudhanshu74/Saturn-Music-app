<svg width="90" height="90" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- House base -->
  <rect x="35" y="50" width="50" height="45" rx="8" ry="8" fill="#f39c12" stroke="#e67e22" stroke-width="3"/>

  <!-- Roof -->
  <polygon points="30,50 60,25 90,50" fill="#e74c3c" stroke="#c0392b" stroke-width="3" />

  <!-- Door -->
  <rect x="65" y="75" width="12" height="20" rx="3" ry="3" fill="#8e44ad" />

  <!-- Funky sparkle dots -->
  <circle cx="20" cy="30" r="3" fill="#fff">
    <animate attributeName="r" values="3;1.5;3" dur="1.6s" repeatCount="indefinite" />
  </circle>
  <circle cx="100" cy="40" r="2.5" fill="#fff" opacity="0.8">
    <animate attributeName="r" values="2.5;1;2.5" dur="1.8s" repeatCount="indefinite" />
  </circle>

  <!-- Googly eye on house for fun -->
  <circle cx="50" cy="70" r="6" fill="#fff" />
  <circle cx="52" cy="72" r="3" fill="#000" />
</svg>
